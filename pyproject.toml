[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-ti-mosaic-tools"
version = "0.1.0"
description = "Download, verify and repair the USGS/ASU THEMIS-derived global thermal inertia mosaic tiles of Mars"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adomas Valantinas" }]
keywords = ["Mars", "THEMIS", "thermal inertia", "Mars Odyssey", "GeoTIFF", "ISIS", "USGS Astrogeology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
raster = ["numpy>=1.23", "rasterio>=1.3", "tifffile>=2022.2"]
pillow = ["Pillow>=9"]
test = ["pytest>=7", "numpy>=1.23", "rasterio>=1.3", "tifffile>=2022.2", "Pillow>=9"]

[project.urls]
Homepage = "https://github.com/euchas/themis-ti-mosaic-tools"
Repository = "https://github.com/euchas/themis-ti-mosaic-tools"
Issues = "https://github.com/euchas/themis-ti-mosaic-tools/issues"
Changelog = "https://github.com/euchas/themis-ti-mosaic-tools/blob/main/CHANGELOG.md"

[project.scripts]
themis-ti-tools = "themis_ti_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
themis_ti_tools = ["data/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
